name: Pull Request Checks
on:
  workflow_call:
    inputs:
      run_on_reopened:
        description: 'Run checks when pull request is reopened'
        required: false
        type: boolean
        default: false
      review_mode:
        description: >-
          Review output variant:
          "blockers" = strict profile, inline comments + REQUEST_CHANGES (blocks the PR);
          "pending"  = full profile, comments posted as a PENDING draft review for the
          reviewer to curate & submit (requires the reviewer_pat secret).
        required: false
        type: string
        default: blockers
    secrets:
      reviewer_pat:
        description: >-
          PAT of the reviewer account. Required only for review_mode=pending —
          a pending review is visible only to its author, so it must be created
          as a real user, not the github-actions bot.
        required: false

concurrency:
  group: "pr-checks-${{ github.repository_id }}-${{ github.event.pull_request.number || github.head_ref || github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  REQUIRED_REVIEWER: 'shoptet-addon-reviewer'
  PROTECTED_FILES: '.github/workflows/shoptetAddon.workflow.yml, .github/workflows/deploy.workflow.yml, .github/workflows/checks.workflow.yml'

jobs:
  review:
    name: Review Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout addon code
        uses: actions/checkout@v6

      - name: Checkout review tool
        uses: actions/checkout@v6
        with:
          repository: shoptet/addon-repository-actions-config
          ref: review_tool
          path: review-tool
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install review tool dependencies
        working-directory: review-tool/linter_review_tool
        run: yarn

      - name: Run linters
        working-directory: ./
        # blockers → strict (only reliable rules gate the PR); pending → full (all findings as draft suggestions).
        run: node review-tool/linter_review_tool/review.js src ${{ inputs.review_mode == 'blockers' && '--strict' || '' }} --rdjson > review-findings.json

      # ── Variant "blockers": reconciled inline PR review comments + gate (GITHUB_TOKEN) ──
      # Posts findings as inline comments on changed lines, dedupes across pushes
      # (fingerprint marker), deletes comments of resolved findings, keeps one
      # REQUEST_CHANGES verdict, and fails the job (the single gating check) on blockers.
      - name: Review — reconcile comments & verdict
        if: ${{ always() && inputs.review_mode == 'blockers' && github.event.pull_request }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const MARKER = 'shoptet-review-fp';

            let diagnostics = [];
            try {
              diagnostics = JSON.parse(fs.readFileSync('review-findings.json', 'utf8')).diagnostics || [];
            } catch (error) {
              core.warning(`Could not read review-findings.json: ${error.message}`);
            }

            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const commit_id = context.payload.pull_request.head.sha;

            // Commentable = new-side line numbers inside diff hunks.
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number });
            const commentable = new Map();
            for (const file of files) {
              if (!file.patch) continue;
              const lines = new Set();
              let newLine = 0;
              for (const raw of file.patch.split('\n')) {
                const hunk = /^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(raw);
                if (hunk) { newLine = parseInt(hunk[1], 10); continue; }
                if (raw.startsWith('+')) { lines.add(newLine); newLine++; }
                else if (raw.startsWith('-')) { /* old side only */ }
                else { newLine++; }
              }
              commentable.set(file.filename, lines);
            }

            // Findings on changed lines only (off-diff lines are not commentable), keyed by fingerprint.
            const fp = (d) => crypto.createHash('sha1')
              .update([d.location.path, d.location.range.start.line, d.code?.value || '', d.message].join('\n'))
              .digest('hex');
            const wanted = new Map();
            for (const d of diagnostics) {
              if (commentable.get(d.location.path)?.has(d.location.range.start.line)) wanted.set(fp(d), d);
            }

            // Existing bot comments we manage (carry our marker).
            const markerRe = new RegExp(`<!-- ${MARKER}:([0-9a-f]+) -->`);
            const existing = await github.paginate(github.rest.pulls.listReviewComments, { owner, repo, pull_number });
            const mine = new Map();
            for (const c of existing) {
              const m = markerRe.exec(c.body || '');
              if (m && c.user && c.user.login === 'github-actions[bot]') mine.set(m[1], c.id);
            }

            let created = 0, deleted = 0;
            for (const [key, d] of wanted) {
              if (mine.has(key)) continue; // dedup — already commented
              const icon = d.severity === 'ERROR' ? '❌' : '⚠️';
              const rule = d.code?.value ? ` \`${d.code.value}\`` : '';
              await github.rest.pulls.createReviewComment({
                owner, repo, pull_number, commit_id,
                path: d.location.path, line: d.location.range.start.line, side: 'RIGHT',
                body: `${icon}${rule}: ${d.message}\n\n<!-- ${MARKER}:${key} -->`,
              });
              created++;
            }
            for (const [key, id] of mine) {
              if (!wanted.has(key)) { // finding resolved → remove its comment
                await github.rest.pulls.deleteReviewComment({ owner, repo, comment_id: id });
                deleted++;
              }
            }

            // Verdict + single gating check (blockers on changed lines only).
            const blockers = [...wanted.values()].filter(d => d.severity === 'ERROR').length;
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number });
            const botRequests = reviews.filter(r => r.user && r.user.login === 'github-actions[bot]' && r.state === 'CHANGES_REQUESTED');
            if (blockers > 0) {
              if (botRequests.length === 0) {
                await github.rest.pulls.createReview({
                  owner, repo, pull_number, event: 'REQUEST_CHANGES',
                  body: `🤖 Automatický review: **${blockers}** blokujících nálezů na změněných řádcích. Detaily v komentářích; po opravě se požadavek automaticky zruší.`,
                });
              }
            } else {
              for (const r of botRequests) {
                await github.rest.pulls.dismissReview({ owner, repo, pull_number, review_id: r.id, message: '✅ Blokující problémy vyřešeny — automaticky odblokováno.' });
              }
            }

            core.info(`Reconciled comments: +${created} / -${deleted}; ${blockers} blocker(s) on changed lines.`);
            if (blockers > 0) core.setFailed(`${blockers} blocking finding(s) on changed lines.`);

      # ── Variant "pending": post findings as a PENDING draft review ──
      - name: Post pending review
        if: ${{ inputs.review_mode == 'pending' && github.event.pull_request }}
        uses: actions/github-script@v7
        env:
          REVIEWER_PAT: ${{ secrets.reviewer_pat }}
        with:
          # Authored by the reviewer PAT so the pending draft is visible to them.
          github-token: ${{ secrets.reviewer_pat }}
          script: |
            const fs = require('fs');

            if (!process.env.REVIEWER_PAT) {
              core.setFailed('review_mode=pending requires the `reviewer_pat` secret (a pending review is visible only to its author).');
              return;
            }

            let diagnostics = [];
            try {
              diagnostics = JSON.parse(fs.readFileSync('review-findings.json', 'utf8')).diagnostics || [];
            } catch (error) {
              core.warning(`Could not read review-findings.json: ${error.message}`);
            }

            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            // Commentable = new-side line numbers inside the diff hunks.
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number });
            const commentable = new Map();
            for (const file of files) {
              if (!file.patch) continue;
              const lines = new Set();
              let newLine = 0;
              for (const raw of file.patch.split('\n')) {
                const hunk = /^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(raw);
                if (hunk) { newLine = parseInt(hunk[1], 10); continue; }
                if (raw.startsWith('+')) { lines.add(newLine); newLine++; }
                else if (raw.startsWith('-')) { /* old side only */ }
                else { newLine++; }
              }
              commentable.set(file.filename, lines);
            }

            const comments = [];
            for (const d of diagnostics) {
              const path = d.location.path;
              const line = d.location.range.start.line;
              if (commentable.get(path)?.has(line)) {
                const icon = d.severity === 'ERROR' ? '❌' : '⚠️';
                const rule = d.code?.value ? ` \`${d.code.value}\`` : '';
                comments.push({ path, line, side: 'RIGHT', body: `${icon}${rule}: ${d.message}` });
              }
            }

            if (comments.length === 0) {
              core.info('No findings on changed lines — no pending review created.');
              return;
            }

            // Only one pending review per user/PR — remove a stale one first.
            const me = await github.rest.users.getAuthenticated();
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number });
            for (const r of reviews) {
              if (r.user?.login === me.data.login && r.state === 'PENDING') {
                await github.rest.pulls.deletePendingReview({ owner, repo, pull_number, review_id: r.id });
              }
            }

            // No `event` → the review stays PENDING (draft) for the reviewer to submit.
            await github.rest.pulls.createReview({
              owner, repo, pull_number,
              body: `🤖 Automatický review Shoptet doplňku — **${comments.length}** připomínek jako **pending draft**. Projdi je a odešli přes „Submit review“.`,
              comments,
            });
            core.info(`Created pending review with ${comments.length} comment(s).`);

  merge-check:
    name: Merge Pull Request alert
    runs-on: ubuntu-latest
    steps:
      - name: Get PR author
        id: pr-info
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            core.setOutput('author', pr.user.login);
            if (process.env.REQUIRED_REVIEWER.split(',').map(reviewer => reviewer.trim()).includes(pr.user.login)) {
              console.log(`User ${pr.user.login} is authorized to merge`);
            } else {
              console.error(`User ${pr.user.login} is NOT authorized to merge - only Shoptet reviewers can merge`);
              process.exit(1);
            }

  files-check:
    name: File Protection Check
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Check protected files
        id: files
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const changedProtectedFiles = files.filter(file =>
              process.env.PROTECTED_FILES.split(',').map(f => f.trim()).includes(file.filename)
            );

            if (changedProtectedFiles.length > 0) {
              console.error('Protected files changed:', changedProtectedFiles.map(f => f.filename));
              process.exit(1);
            } else {
              console.log('No protected files changed');
            }

  collaborators-check:
    name: Shoptet reviewers assigned
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Check required reviewers
        id: reviewers
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const requestedReviewers = pr.requested_reviewers.map(reviewer => reviewer.login);
            const requestedTeams = pr.requested_teams?.map(team => team.slug) || [];
            const allRequestedReviewers = [...requestedReviewers, ...requestedTeams];

            console.log('Required reviewers:', process.env.REQUIRED_REVIEWER);
            console.log('Requested reviewers:', allRequestedReviewers);

            const missingReviewers = process.env.REQUIRED_REVIEWER.split(',').filter(reviewer =>
              !allRequestedReviewers.includes(reviewer.trim())
            );

            if (missingReviewers.length > 0) {
              console.error('Missing required reviewers:', missingReviewers);
              process.exit(1);
            } else {
              console.log('All required reviewers assigned');
            }
