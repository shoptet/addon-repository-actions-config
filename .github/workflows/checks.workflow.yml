name: Pull Request Checks
on:
  workflow_call:

concurrency:
  group: "pr-checks-${{ github.repository_id }}-${{ github.event.pull_request.number || github.head_ref || github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  REQUIRED_REVIEWER: 'shoptet-addon-reviewer'
  PROTECTED_FILES: '.github/workflows/shoptetAddon.workflow.yml, .github/workflows/deploy.workflow.yml, .github/workflows/checks.workflow.yml'

jobs:
  review:
    name: Review Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout addon code
        uses: actions/checkout@v6
        with:
          # Check out the PR HEAD (not the default merge ref) so the linter sees
          # exactly the code that review comments are anchored to — otherwise a
          # base branch that moved would shift line numbers (wrong-line comments
          # / 422). Full history so we can reconstruct changed lines via `git diff`
          # for large files whose diff GitHub omits from the API `patch` field.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout review tool
        uses: actions/checkout@v6
        with:
          repository: shoptet/addon-repository-actions-config
          # MUST match the branch this workflow lives on — the linter code + rule
          # config are read from this ref. (github.job_workflow_sha would remove
          # this manual step, but it resolves empty in this setup, so it can't be
          # used; workflow_sha/workflow_ref point at the caller, not this repo.)
          ref: feature/linter-review-tool
          path: review-tool
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install review tool dependencies
        working-directory: review-tool/linter_review_tool
        # --frozen-lockfile: reproducible install, fail if yarn.lock is out of date.
        run: yarn --frozen-lockfile

      - name: Run linters
        id: lint
        working-directory: ./
        # Runs the reliable rule set; emits Diagnostic JSON consumed by the next step.
        run: node review-tool/linter_review_tool/review.js src --rdjson > review-findings.json

      # Reconciled inline PR review comments + gate (GITHUB_TOKEN).
      # Posts findings as inline comments on changed lines, dedupes across pushes
      # (fingerprint marker), deletes comments of resolved findings, keeps one
      # REQUEST_CHANGES verdict, and fails the job (the single gating check) on blockers.
      #
      # Guarded on the linter having SUCCEEDED: if it crashes (or finds no source),
      # review-findings.json is empty/invalid → we must NOT read that as "0 findings"
      # and wipe existing comments / dismiss the standing REQUEST_CHANGES. On lint
      # failure this step is skipped and the job stays red (fail-closed).
      - name: Review — reconcile comments & verdict
        if: ${{ steps.lint.outcome == 'success' && github.event.pull_request }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            // Shared, self-tested logic (diff parsing + fingerprinting) lives in
            // the checked-out tool so it is covered by the linter self-test.
            const { parseAddedLines, findingFingerprint: fp } = require(
              `${process.env.GITHUB_WORKSPACE}/review-tool/linter_review_tool/lib/reconcile-utils.js`
            );
            const MARKER = 'shoptet-review-fp';

            // Fail closed on an unreadable/corrupt findings file. The lint step
            // exited 0, so an invalid JSON here is NOT "0 findings" — treating it
            // that way would wipe existing comments and dismiss the standing
            // REQUEST_CHANGES. (Invariant: review.js rdjson stdout is pure JSON.)
            let payload;
            try {
              payload = JSON.parse(fs.readFileSync('review-findings.json', 'utf8'));
            } catch (error) {
              core.setFailed(`review-findings.json is missing or invalid (${error.message}) — refusing to treat it as a clean run.`);
              return;
            }
            const diagnostics = payload.diagnostics || [];
            const skippedFiles = payload.skipped || [];

            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const commit_id = context.payload.pull_request.head.sha;
            const base_sha = context.payload.pull_request.base.sha;

            // We checked out HEAD, so the base commit may not be in local history —
            // make sure it is before diffing against it (best-effort).
            try {
              execFileSync('git', ['fetch', '--no-tags', '--depth=1', 'origin', base_sha], { stdio: 'ignore' });
            } catch (error) {
              core.warning(`Could not fetch base ${base_sha.slice(0, 7)} for local diff: ${error.message}`);
            }

            // Commentable = new-side line numbers of additions per file
            // (parseAddedLines comes from the self-tested reconcile-utils module).
            // GitHub omits `patch` for large files, so fall back to a local
            // `git diff` (needs fetch-depth: 0) — the fix that lets large files
            // get inline comments and gate the PR. Value semantics:
            //   Set  → only these lines are commentable
            //   null → couldn't determine — findings still GATE and appear in the
            //          Summary, but no inline comments are attempted for them
            //          (an off-diff anchor would 422 and poison a whole chunk)
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number });
            const commentable = new Map();
            for (const file of files) {
              // GitHub refuses inline comments on files whose diff exceeds its
              // ~20k-line render ceiling — the createReview call 422s ("diff
              // entry is too large") and voids the WHOLE chunk. Measured
              // empirically: 20,001 changed lines rejected, 5,001 accepted.
              // Treat such files as unanchored up front: gate + Summary only.
              if (file.changes > 20000) {
                core.warning(`${file.filename}: ${file.changes} changed lines exceed GitHub's per-file comment ceiling — findings gate but appear only in the Summary.`);
                commentable.set(file.filename, null);
                continue;
              }
              if (file.patch) {
                commentable.set(file.filename, parseAddedLines(file.patch));
                continue;
              }
              try {
                // execFileSync (no shell) — `file.filename` is attacker-controlled
                // (PR author names the file), so it must never reach `/bin/sh -c`.
                // `--` additionally guards against git option injection.
                const diff = execFileSync(
                  'git',
                  ['diff', '--unified=0', `${base_sha}...${commit_id}`, '--', file.filename],
                  { encoding: 'utf8', maxBuffer: 128 * 1024 * 1024 }
                );
                commentable.set(file.filename, parseAddedLines(diff));
              } catch (error) {
                core.warning(`No API patch and git diff failed for ${file.filename}: ${error.message}`);
                commentable.set(file.filename, null); // gate, but don't attempt comments
              }
            }

            // Findings on changed lines only (off-diff lines are not commentable),
            // keyed by fingerprint. Findings from `null` files gate but are marked
            // unanchored — never posted inline (they'd 422), Summary carries them.
            const wanted = new Map();
            const unanchored = new Set();
            for (const d of diagnostics) {
              // Warnings are kept: the strict profile already limited findings to
              // 100%-reliable rules, so recommendations here are trustworthy too.
              // Only ERROR severity gates the PR (see `blockers` below).
              if (!commentable.has(d.location.path)) continue; // file not part of this PR
              const lines = commentable.get(d.location.path);
              if (lines === null) {
                const key = fp(d);
                wanted.set(key, d);
                unanchored.add(key);
              } else if (lines.has(d.location.range.start.line)) {
                wanted.set(fp(d), d);
              }
            }

            // Existing bot comments we manage (carry our marker).
            // Anchored to the END of the body: finding messages embed file content, so
            // a PR author could plant a fake marker earlier in the text and corrupt
            // the reconcile bookkeeping if we took the first match.
            const markerRe = new RegExp(`<!-- ${MARKER}:([0-9a-f]+) -->\\s*$`);
            const existing = await github.paginate(github.rest.pulls.listReviewComments, { owner, repo, pull_number });
            const mine = new Map();
            for (const c of existing) {
              const m = markerRe.exec(c.body || '');
              if (!m || !c.user || c.user.login !== 'github-actions[bot]') continue;
              if (mine.has(m[1])) {
                // Duplicate fingerprint (e.g. two runs racing through the
                // cancel-in-progress window). Overwriting the map entry would
                // orphan the older comment forever — delete the duplicate now.
                try { await github.rest.pulls.deleteReviewComment({ owner, repo, comment_id: c.id }); }
                catch (error) { core.warning(`Could not delete duplicate comment ${c.id}: ${error.message}`); }
                continue;
              }
              mine.set(m[1], c.id);
            }

            // Gate on all commentable blockers (independent of how many we post).
            const blockers = [...wanted.values()].filter(d => d.severity === 'ERROR').length;
            const total = wanted.size;
            const recommendations = total - blockers;

            // New findings (not already commented), blockers first, capped so we
            // never burst hundreds of comments — that trips GitHub's secondary
            // rate limit ("blocked from content creation") and isn't useful to a
            // human reviewer anyway. The overflow count is surfaced in the body.
            const MAX_COMMENTS = 100;
            const fresh = [...wanted.entries()]
              .filter(([key]) => !mine.has(key) && !unanchored.has(key))
              .sort((a, b) => (a[1].severity === 'ERROR' ? 0 : 1) - (b[1].severity === 'ERROR' ? 0 : 1));
            const unanchoredCount = [...unanchored].filter((key) => !mine.has(key)).length;
            const capped = fresh.slice(0, MAX_COMMENTS);
            const overflow = fresh.length - capped.length;
            // ONE definition of "shown" for both the verdict body and the
            // Summary header — the two must never disagree (round 9 nit).
            const shown = total - overflow - unanchoredCount;
            const comments = capped.map(([key, d]) => {
              const icon = d.severity === 'ERROR' ? '❌' : '⚠️';
              const rule = d.code?.value ? ` \`${d.code.value}\`` : '';
              return {
                path: d.location.path, line: d.location.range.start.line, side: 'RIGHT',
                body: `${icon}${rule}: ${d.message}\n\n<!-- ${MARKER}:${key} -->`,
              };
            });

            // Delete comments of resolved findings (usually few).
            let deleted = 0;
            for (const [key, id] of mine) {
              if (!wanted.has(key)) {
                try { await github.rest.pulls.deleteReviewComment({ owner, repo, comment_id: id }); deleted++; }
                catch (error) { core.warning(`Could not delete comment ${id}: ${error.message}`); }
              }
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number });
            const hasRequest = reviews.some(r => r.user && r.user.login === 'github-actions[bot]' && r.state === 'CHANGES_REQUESTED');

            // ONE content-creation call: new comments + verdict together.
            // (REQUEST_CHANGES only if we don't already have one standing.)
            const event = blockers > 0 && !hasRequest ? 'REQUEST_CHANGES' : 'COMMENT';
            let created = 0;
            if (comments.length || (blockers > 0 && !hasRequest)) {
              const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
              const counts = `**${blockers}** blocker(s)`
                + (recommendations > 0 ? ` and ${recommendations} recommendation(s)` : '');
              let body = blockers > 0
                ? `🤖 Automated review: ${counts} on changed lines. `
                  + (overflow > 0 || unanchoredCount > 0
                      ? `Showing **${shown} of ${total}** findings in comments (blockers first) — the full list is in the run's [Summary](${runUrl}). `
                      : `All are shown as inline comments on the relevant lines. `)
                  + `Once the blockers are fixed, this request is dismissed automatically.`
                : `🤖 Automated review: no blockers, ${recommendations} recommendation(s) on changed lines`
                  + (overflow > 0 || unanchoredCount > 0 ? ` (${shown} of ${total} shown in comments, full list in the run's [Summary](${runUrl}))` : '') + `.`;
              if (unanchoredCount > 0) {
                body += ` ${unanchoredCount} finding(s) are in files whose changed lines could not be resolved and appear only in the Summary.`;
              }
              // A single review with ~100 comments still trips GitHub's secondary
              // content-creation limit (~25-30 per review is safe), so post in
              // chunks with a pause between them: verdict rides on the first
              // chunk, follow-ups are plain COMMENT reviews. Never fan out to
              // per-comment calls (that makes the limit worse).
              const CHUNK = 25;
              const chunks = [];
              for (let i = 0; i < comments.length; i += CHUNK) chunks.push(comments.slice(i, i + CHUNK));
              if (!chunks.length) chunks.push([]); // verdict-only review (no new comments)
              for (let ci = 0; ci < chunks.length; ci++) {
                const chunkEvent = ci === 0 ? event : 'COMMENT';
                const chunkBody = ci === 0 ? body
                  : `🤖 Automated review — additional comments (${ci + 1}/${chunks.length}).`;
                let posted = false;
                for (let attempt = 0; attempt < 3 && !posted; attempt++) {
                  try {
                    await github.rest.pulls.createReview({
                      owner, repo, pull_number, commit_id,
                      event: chunkEvent, body: chunkBody, comments: chunks[ci],
                    });
                    created += chunks[ci].length;
                    posted = true;
                  } catch (error) {
                    const secondary = /secondary rate limit|submitted too quickly|content creation/i.test(error.message);
                    if (secondary && attempt < 2) { await new Promise(r => setTimeout(r, 60000 * (attempt + 1))); continue; }
                    core.warning(`Could not post review chunk ${ci + 1}/${chunks.length}: ${error.message}`);
                    // A bad line anchor makes createReview 422 and drops the whole
                    // chunk atomically. For chunk 0 that would also lose the verdict,
                    // so degrade: post the verdict alone (no inline comments) — the
                    // Summary table still carries every finding.
                    if (ci === 0 && chunkEvent === 'REQUEST_CHANGES') {
                      try {
                        await github.rest.pulls.createReview({ owner, repo, pull_number, event: 'REQUEST_CHANGES', body });
                      } catch (verdictError) {
                        core.warning(`Could not post fallback verdict: ${verdictError.message}`);
                      }
                    }
                    // Non-retryable (e.g. 422) — retrying would just repeat the same
                    // failure and post the fallback verdict again. Handle once, stop.
                    break;
                  }
                }
                // NOTE: aborting here after a chunk-0 non-retryable failure also
                // suppresses all remaining chunks for this run — a deliberate
                // trade-off (documented in README): the gate (setFailed) and the
                // complete Summary table are unaffected, and retrying subsequent
                // chunks after a systemic 4xx would likely fail the same way.
                if (!posted) break; // stop hammering the API — the Summary table has the full list
                if (ci < chunks.length - 1) await new Promise(r => setTimeout(r, 10000));
              }
            }

            // Clear a standing REQUEST_CHANGES once everything is resolved.
            if (blockers === 0) {
              for (const r of reviews.filter(r => r.user && r.user.login === 'github-actions[bot]' && r.state === 'CHANGES_REQUESTED')) {
                try { await github.rest.pulls.dismissReview({ owner, repo, pull_number, review_id: r.id, message: '✅ All blockers resolved — automatically dismissed.' }); }
                catch (error) { core.warning(`Could not dismiss review ${r.id}: ${error.message}`); }
              }
            }

            // Job Summary: full, uncapped table of every finding (inline comments
            // are capped for readability, but the summary is the complete source
            // of truth — one write, no rate limit).
            core.summary.addHeading('🔍 Code Review — findings', 2);
            if (total === 0) {
              core.summary.addRaw('✅ No findings on changed lines.');
            } else {
              core.summary.addRaw(
                `Found **${blockers}** blocker(s) (❌) and **${recommendations}** recommendation(s) (⚠️) on changed lines` +
                (overflow > 0 || unanchoredCount > 0
                  ? ` — ${shown} of ${total} shown as PR comments` +
                    (unanchoredCount > 0 ? ` (${unanchoredCount} unanchored — inline comments not possible for their files)` : '') +
                    `, full list below.`
                  : '.'),
                true
              );
              const rows = [...wanted.values()]
                .sort((a, b) => (a.severity === 'ERROR' ? 0 : 1) - (b.severity === 'ERROR' ? 0 : 1)
                  || a.location.path.localeCompare(b.location.path)
                  || a.location.range.start.line - b.location.range.start.line)
                .map(d => [
                  d.severity === 'ERROR' ? '❌' : '⚠️',
                  d.location.path,
                  String(d.location.range.start.line),
                  d.code?.value || '',
                  d.message.replace(/\r?\n/g, ' '),
                ]);
              core.summary.addTable([
                [
                  { data: '', header: true },
                  { data: 'File', header: true },
                  { data: 'Line', header: true },
                  { data: 'Rule', header: true },
                  { data: 'Message', header: true },
                ],
                ...rows,
              ]);
            }
            // Surface files the linter deliberately skipped (minified/vendored),
            // so a human reviewer can see when the gate's coverage was partial.
            if (skippedFiles.length) {
              const list = skippedFiles.slice(0, 20).map((f) => `\`${f}\``).join(', ');
              const more = skippedFiles.length > 20 ? ` … and ${skippedFiles.length - 20} more` : '';
              core.summary.addRaw(
                `\n⏭️ **${skippedFiles.length} file(s) skipped** as minified/vendored/generated (not linted): ${list}${more}`,
                true
              );
            }
            await core.summary.write();

            core.info(`Comments posted: ${created} (+${overflow} hidden) / -${deleted}; ${blockers} blocker(s), ${recommendations} recommendation(s) on changed lines.`);
            if (blockers > 0) core.setFailed(`${blockers} blocking finding(s) on changed lines.`);

      # Fail-safe for callers not triggered by a pull_request event (push,
      # schedule, workflow_dispatch, …): the reconcile step above is skipped
      # there, and review.js in rdjson mode always exits 0 — which would turn
      # any blocker into a green check. Re-run in plain mode, which exits 1 on
      # blockers, so the gate holds regardless of the triggering event.
      - name: Gate on blockers (non-PR event)
        if: ${{ steps.lint.outcome == 'success' && !github.event.pull_request }}
        working-directory: ./
        run: node review-tool/linter_review_tool/review.js src

  merge-check:
    name: Merge Pull Request alert
    runs-on: ubuntu-latest
    steps:
      - name: Get PR author
        id: pr-info
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            core.setOutput('author', pr.user.login);
            if (process.env.REQUIRED_REVIEWER.split(',').map(reviewer => reviewer.trim()).includes(pr.user.login)) {
              console.log(`User ${pr.user.login} is authorized to merge`);
            } else {
              console.error(`User ${pr.user.login} is NOT authorized to merge - only Shoptet reviewers can merge`);
              process.exit(1);
            }

  files-check:
    name: File Protection Check
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Check protected files
        id: files
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const changedProtectedFiles = files.filter(file =>
              process.env.PROTECTED_FILES.split(',').map(f => f.trim()).includes(file.filename)
            );

            if (changedProtectedFiles.length > 0) {
              console.error('Protected files changed:', changedProtectedFiles.map(f => f.filename));
              process.exit(1);
            } else {
              console.log('No protected files changed');
            }

  collaborators-check:
    name: Shoptet reviewers assigned
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Check required reviewers
        id: reviewers
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const requestedReviewers = pr.requested_reviewers.map(reviewer => reviewer.login);
            const requestedTeams = pr.requested_teams?.map(team => team.slug) || [];
            const allRequestedReviewers = [...requestedReviewers, ...requestedTeams];

            console.log('Required reviewers:', process.env.REQUIRED_REVIEWER);
            console.log('Requested reviewers:', allRequestedReviewers);

            const missingReviewers = process.env.REQUIRED_REVIEWER.split(',').filter(reviewer =>
              !allRequestedReviewers.includes(reviewer.trim())
            );

            if (missingReviewers.length > 0) {
              console.error('Missing required reviewers:', missingReviewers);
              process.exit(1);
            } else {
              console.log('All required reviewers assigned');
            }
