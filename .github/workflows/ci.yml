name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run actionlint
        env:
          # v1.7.12 — the SHA pins the download script, the version pins the binary
          ACTIONLINT_COMMIT: 914e7df21a07ef503a81201c76d2b11c789d3fca
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -sSfL -o download-actionlint.bash "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_COMMIT}/scripts/download-actionlint.bash"
          bash download-actionlint.bash "$ACTIONLINT_VERSION"
          ./actionlint -color

  workflow-script-tests:
    name: Workflow script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run tests
        run: bash tests/test-workflow-scripts.sh
