      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for OIDC trusted publishing (needs npm >=11.5.1)
        run: npm install -g npm@^11.5.1

      - name: Tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME##*/v}"
          manifest_version="$(node -p 'require("./package.json").version')"
          [ "$tag_version" = "$manifest_version" ] || {
            echo "tag $tag_version != package.json $manifest_version"; exit 1; }

      - name: Verify packed tarball
        run: node ../../scripts/verify-pack.js .

      - name: Publish
        run: npm publish --access public
